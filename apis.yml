aid: goodship
name: GoodShip
description: 'GoodShip is a freight orchestration and procurement platform for shippers,
  brokers, and asset-based carriers. It unifies TMS tender, contract-award, and location
  data, enriches it with real-time market rates, and layers AI-assisted bid analysis
  (via its Laney AI transportation analyst), lane- and carrier-level performance analytics,
  carrier scorecards, and in-app collaboration on top. Teams run mini-bids and full-network
  RFPs, benchmark spend against the market, and take corrective action without dedicated
  developer resources. Plug-and-play with major transportation management systems;
  backed by Bessemer Venture Partners and serving US and Canadian operations.'
